<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Jet | Contact Us</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html"><img src="images/favicon.ico" alt="Travel Jet Logo" class="logo"S></a>
        <ul class="nav-links" id="primary-nav">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-controls="primary-nav"
            aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </header>

    <main>
        <form class="contact-form">
            <h1>Contact Us</h1>
            <p id="form-confirmation" class="hidden" aria-live="polite">Your message has been successfully sent.</p>
            <label for="name">Name:</label>
            <input type="text" id="name" required placeholder="Enter your name">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Enter your email">
            <label for="message">Message:</label>
            <textarea id="message" required placeholder="Enter your message..."></textarea>
            <input type="submit" class="btn">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Travel Jet. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
